# יצירת קובץ ה-HTML של ה-Web App בתוך תיקיית ג'נרטור
import os

html_content = """<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Poker Club</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1c29, #10111a);
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            overflow: hidden;
        }
        
        /* שולחן הפוקר המרהיב */
        .poker-table {
            background: radial-gradient(circle, #1b7343 0%, #0d4022 100%);
            border: 12px solid #5c3a21;
            border-radius: 150px;
            width: 90%;
            max-width: 400px;
            height: 250px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6), inset 0 0 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 30px;
        }

        .pot-display {
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            color: #ffcc00;
            border: 1px solid #ffcc00;
        }

        .community-cards {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        /* עיצוב קלפים תלת-ממדי ומודרני */
        .card {
            background: white;
            color: black;
            width: 45px;
            height: 65px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            transform: translateY(0);
            transition: transform 0.2s;
        }
        
        .card.red { color: #e63946; }

        /* אזור השחקן והאסימונים */
        .player-area {
            text-align: center;
            width: 100%;
        }

        .chips-counter {
            font-size: 18px;
            color: #4cc9f0;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* כפתורי פעולה מודרניים */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 350px;
        }

        .btn {
            background: linear-gradient(135deg, #3a0ca3, #7209b7);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(114, 9, 183, 0.3);
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:active { transform: scale(0.95); }
        .btn.fold { background: linear-gradient(135deg, #d62828, #003049); }
    </style>
</head>
<body>

    <!-- שולחן המשחק -->
    <div class="poker-table">
        <div class="pot-display">💰 POT: $1,200</div>
        <div class="community-cards">
            <div class="card red">10♦</div>
            <div class="card">J♠</div>
            <div class="card red">Q♥</div>
        </div>
    </div>

    <!-- נתוני השחקן וכפתורים -->
    <div class="player-area">
        <div class="chips-counter">🪙 My Chips: $5,450</div>
        <div class="actions-grid">
            <button class="btn" onclick="sendAction('Check')">Check</button>
            <button class="btn" onclick="sendAction('Raise')">Raise</button>
            <button class="btn fold" onclick="sendAction('Fold')">Fold</button>
        </div>
    </div>

    <script>
        // אתחול יישומון הרשת של טלגרם
        const tg = window.Telegram.WebApp;
        tg.expand(); // פתיחת החלון למקסימום גובה במסך הטלפון

        function sendAction(actionName) {
            // שליחת הנתון חזרה לבוט הפייתון וסגירת החלון
            tg.sendData(actionName);
            tg.close();
        }
    </script>
</body>
</html>
"""

os.makedirs('generated', exist_ok=True)
with open('generated/poker_app.html', 'w', encoding='utf-8') as f:
    f.write(html_content)
