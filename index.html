<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Poker Club</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1c29, #10111a);
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            overflow: hidden;
        }
        .poker-table {
            background: radial-gradient(circle, #1b7343 0%, #0d4022 100%);
            border: 12px solid #5c3a21;
            border-radius: 150px;
            width: 90%;
            max-width: 400px;
            height: 250px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6), inset 0 0 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 30px;
        }
        .pot-display {
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            color: #ffcc00;
            border: 1px solid #ffcc00;
        }
        .community-cards {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }
        .card {
            background: white;
            color: black;
            width: 48px;
            height: 70px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .card.red { color: #e63946; }
        .player-area { text-align: center; width: 100%; }
        .chips-counter { font-size: 18px; color: #4cc9f0; font-weight: bold; margin-bottom: 15px; }
        .actions-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 350px; }
        .btn { background: linear-gradient(135deg, #3a0ca3, #7209b7); border: none; color: white; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(114, 9, 183, 0.3); }
        .btn.fold { background: linear-gradient(135deg, #d62828, #003049); }
    </style>
</head>
<body>

    <div class="poker-table">
        <div class="pot-display" id="pot-val">💰 POT: $0</div>
        <div class="community-cards" id="board">
            <!-- קלפי השולחן יופיעו כאן באופן דינמי -->
        </div>
    </div>

    <div class="player-area">
        <div class="chips-counter" id="chips-val">🪙 My Chips: $0</div>
        <div style="font-size:14px; margin-bottom:10px;">Your Hand: <span id="hand" style="font-weight:bold; color:#ffcc00;"></span></div>
        <div class="actions-grid">
            <button class="btn" onclick="sendAction('Check')">Check</button>
            <button class="btn" onclick="openRaisePopup()">Raise</button>
            <button class="btn fold" onclick="sendAction('Fold')">Fold</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // קריאת המשתנים מהקישור שפייתון שלח
        const urlParams = new URLSearchParams(window.location.search);

        // אם הפרמטר לא קיים, נשים ערך ברירת מחדל מלהיב כדי שלא יישמר ריק
        const pot = urlParams.get('pot') || '1,500';
        const chips = urlParams.get('chips') || '10,000';
        const cards = urlParams.get('cards') || 'A♦,K♠,Q♥';
        const hand = urlParams.get('hand') || 'J♣ 10♥️';

        // עדכון האלמנטים במסך
        document.getElementById('pot-val').innerText = `💰 POT: $${pot}`;
        document.getElementById('chips-val').innerText = `🪙 My Chips: $${chips}`;
        document.getElementById('hand').innerText = hand;

        // יצירת קלפי שולחן ויזואליים
        const boardDiv = document.getElementById('board');
        const cardsArray = cards.split(',');
        cardsArray.forEach(card => {
            if(card.trim() === "") return;
            const isRed = card.includes('♦') || card.includes('♥') || card.includes('♥️');
            const cardEl = document.createElement('div');
            cardEl.className = `card ${isRed ? 'red' : ''}`;
            cardEl.innerText = card;
            boardDiv.appendChild(cardEl);
        });

        // פונקציה לפתיחת חלון קופץ מודרני מובנה של טלגרם להזנת סכום הימור
        function openRaisePopup() {
            tg.showPopup({
                title: 'העלאת הימור (Raise)',
                message: 'בחר סכום להעלאה:',
                buttons: [
                    {id: 'r500', type: 'default', text: '+$500'},
                    {id: 'r1000', type: 'default', text: '+$1,000'},
                    {id: 'allin', type: 'destructive', text: '🔥 ALL IN!'},
                    {type: 'cancel', text: 'ביטול'}
                ]
            }, function(buttonId) {
                if (buttonId === 'r500') sendAction('Raise $500');
                if (buttonId === 'r1000') sendAction('Raise $1000');
                if (buttonId === 'allin') sendAction('ALL IN 💥');
            });
        }

        function sendAction(actionName) {
            tg.sendData(actionName);
            tg.close();
        }
    </script>
</body>
</html>
