<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Poker Club</title>
    <!-- טעינת הספרייה הרשמית של טלגרם למשחקים -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1c29, #10111a);
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            overflow: hidden;
        }
        .poker-table {
            background: radial-gradient(circle, #1b7343 0%, #0d4022 100%);
            border: 12px solid #5c3a21;
            border-radius: 150px;
            width: 90%;
            max-width: 400px;
            height: 250px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6), inset 0 0 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 30px;
        }
        .pot-display {
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            color: #ffcc00;
            border: 1px solid #ffcc00;
        }
        .community-cards {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }
        .card {
            background: white;
            color: black;
            width: 48px;
            height: 70px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .card.red { color: #e63946; }
        .player-area { text-align: center; width: 100%; }
        .chips-counter { font-size: 18px; color: #4cc9f0; font-weight: bold; margin-bottom: 15px; }
        .actions-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 350px; }
        .btn { background: linear-gradient(135deg, #3a0ca3, #7209b7); border: none; color: white; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(114, 9, 183, 0.3); }
        .btn.fold { background: linear-gradient(135deg, #d62828, #003049); }
    </style>
</head>
<body>

    <div class="poker-table">
        <div class="pot-display" id="pot-val">💰 POT: $1,500</div>
        <div class="community-cards" id="board">
            <div class="card red">A♦</div>
            <div class="card">K♠</div>
            <div class="card red">Q♥</div>
        </div>
    </div>

    <div class="player-area">
        <div class="chips-counter" id="chips-val">🪙 My Chips: $8,400</div>
        <div style="font-size:14px; margin-bottom:10px;">Your Hand: <span id="hand" style="font-weight:bold; color:#ffcc00;">J♣ 10♥️</span></div>
        <div class="actions-grid">
            <!-- הוספת onClick תקין לחלוטין שמפעיל את הפונקציה -->
            <button class="btn" onclick="sendAction('Check')">Check</button>
            <button class="btn" onclick="sendAction('Raise')">Raise</button>
            <button class="btn fold" onclick="sendAction('Fold')">Fold</button>
        </div>
    </div>

    <script>
        // אתחול חובה של ממשק טלגרם
        const tg = window.Telegram.WebApp;
        tg.ready(); // מודיע לטלגרם שהאתר מוכן לפעולה
        tg.expand(); // פותח את המסך למקסימום גובה

        function sendAction(actionName) {
            try {
                // פקודת הקסם של טלגרם ששולחת את הטקסט חזרה לבוט הפייתון
                tg.sendData(message=actionName);
                // סגירה מיידית של חלון המשחק לאחר הלחיצה
                tg.close();
            } catch (error) {
                alert("שגיאה בשליחת הנתונים לטלגרם: " + error.message);
            }
        }
    </script>
</body>
</html>
