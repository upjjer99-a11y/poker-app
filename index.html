<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Poker Club</title>
    <!-- טעינת ספריית יישומוני הרשת הרשמית והמעודכנת של טלגרם -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1c29, #10111a);
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* שולחן הפוקר הירוק והמרהיב */
        .poker-table {
            background: radial-gradient(circle, #1b7343 0%, #0d4022 100%);
            border: 12px solid #5c3a21;
            border-radius: 150px;
            width: 95%;
            max-width: 380px;
            height: 240px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6), inset 0 0 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 25px;
        }

        .pot-display {
            background: rgba(0, 0, 0, 0.75);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            color: #ffcc00;
            border: 1px solid #ffcc00;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .community-cards {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        /* עיצוב קלפים תלת-ממדי */
        .card {
            background: #ffffff;
            color: #000000;
            width: 50px;
            height: 72px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }
        
        .card.red { color: #e63946; }

        /* אזור נתוני השחקן */
        .player-area {
            text-align: center;
            width: 100%;
        }

        .chips-counter {
            font-size: 19px;
            color: #4cc9f0;
            font-weight: bold;
            margin-bottom: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .hand-display {
            font-size: 15px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 10px;
            display: inline-block;
        }

        /* כפתורי פעולה מודרניים חלקים */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 360px;
        }

        .btn {
            background: linear-gradient(135deg, #3a0ca3, #7209b7);
            border: none;
            color: white;
            padding: 14px 10px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(114, 9, 183, 0.35);
            transition: transform 0.1s, filter 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.94);
            filter: brightness(1.2);
        }

        .btn.fold {
            background: linear-gradient(135deg, #d62828, #1d0000);
            box-shadow: 0 4px 15px rgba(214, 40, 40, 0.35);
        }
    </style>
</head>
<body>

    <!-- שולחן המשחק המרהיב -->
    <div class="poker-table">
        <div class="pot-display" id="pot-val">💰 POT: $1,500</div>
        <div class="community-cards" id="board">
            <!-- קלפי השולחן הדינמיים ייבנו כאן -->
        </div>
    </div>

    <!-- אזור השחקן והפעולות -->
    <div class="player-area">
        <div class="chips-counter" id="chips-val">🪙 My Chips: $8,400</div>
        <div class="hand-display">Your Hand: <span id="hand" style="font-weight:bold; color:#ffcc00;"></span></div>
        
        <div class="actions-grid">
            <button class="btn" onclick="sendAction('Check')">Check</button>
            <button class="btn" onclick="openRaisePopup()">Raise</button>
            <button class="btn fold" onclick="sendAction('Fold')">Fold</button>
        </div>
    </div>

    <script>
        // אתחול והרחבת חלון היישומון בטלגרם למקסימום גובה
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // קריאת הפרמטרים החסינים מהכתובת שפייתון שולח
        const urlParams = new URLSearchParams(window.location.search);
        const pot = urlParams.get('pot') || '1,500';
        const chips = urlParams.get('chips') || '8,400';
        const cards = urlParams.get('cards') || 'AD,KS,QH';
        const hand = urlParams.get('hand') || 'JC,10H';

        // עדכון טקסטים במסך
        document.getElementById('pot-val').innerText = `💰 POT: $${pot}`;
        document.getElementById('chips-val').innerText = `🪙 My Chips: $${chips}`;

        // פונקציה להמרת אותיות אנגליות לסמלי קלפים צבעוניים
        function parseCard(cardStr) {
            let txt = cardStr.trim();
            txt = txt.replace('H', '♥️').replace('D', '♦️').replace('C', '♣️').replace('S', '♠️');
            const isRed = cardStr.includes('H') || cardStr.includes('D');
            return { text: txt, red: isRed };
        }

        // רינדור קלפי השולחן (Community Cards)
        const boardDiv = document.getElementById('board');
        cards.split(',').forEach(c => {
            if(!c) return;
            const cardInfo = parseCard(c);
            const cardEl = document.createElement('div');
            cardEl.className = `card ${cardInfo.red ? 'red' : ''}`;
            cardEl.innerText = cardInfo.text;
            boardDiv.appendChild(cardEl);
        });

        // רינדור קלפי היד של השחקן (Hand)
        let handText = "";
        hand.split(',').forEach(c => {
            if(!c) return;
            handText += parseCard(c).text + " ";
        });
        document.getElementById('hand').innerText = handText;

        // חלון קופץ רשמי ומרהיב של טלגרם לבחירת הימור (Raise)
        function openRaisePopup() {
            tg.showPopup({
                title: 'העלאת הימור (Raise)',
                message: 'בחר סכום להוספה לקופה:',
                buttons: [
                    {id: 'r500', type: 'default', text: '+$500'},
                    {id: 'r1000', type: 'default', text: '+$1,000'},
                    {id: 'allin', type: 'destructive', text: '🔥 ALL IN!'},
                    {type: 'cancel', text: 'ביטול המשך הימור'}
                ]
            }, function(buttonId) {
                if (buttonId === 'r500') sendAction('Raise $500');
                if (buttonId === 'r1000') sendAction('Raise $1000');
                if (buttonId === 'allin') sendAction('ALL IN 💥');
            });
        }

        // פונקציית שליחת המידע חזרה לפייתון וסגירת החלון
        function sendAction(actionName) {
            try {
                tg.sendData(actionName);
                tg.close();
            } catch (error) {
                // הגנה למקרה שהאתר נפתח דרך כפתור תפריט חסום - סגירה רכה
                tg.close();
            }
        }
    </script>
</body>
</html>
